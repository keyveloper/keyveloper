name: Latest blog posts

on:
  schedule:
    - cron: "0 */6 * * *" # 6시간마다
  workflow_dispatch: # Actions 탭의 Run workflow 버튼

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@v1
        env:
          TZ: Asia/Seoul # 날짜를 한국 시간으로 표시
        with:
          feed_list: "https://rss.blog.naver.com/jword_.xml"
          max_post_count: 5
          template: "$newline- [$title]($url) - $date"
          date_format: "mmm d, yyyy"
